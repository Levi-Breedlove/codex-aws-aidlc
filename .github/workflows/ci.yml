name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - fast-lane
      - fast-lane-foundation

permissions:
  contents: read

env:
  FASTLANE_CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  repository-precheck:
    runs-on: ubuntu-latest
    env:
      FASTLANE_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}

    steps:
      - name: Check out repository with comparison history
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.FASTLANE_CANDIDATE_COMMIT }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "${FASTLANE_CANDIDATE_COMMIT}"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 22 for deterministic diagram rendering
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22.17.1"

      - name: Validate Python syntax and indentation
        run: |
          python -m compileall -q bootstrap.py scripts tests .codex/hooks
          python -m tabnanny bootstrap.py scripts tests .codex/hooks

      - name: Run Ruff lint
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.0"
          args: check --no-cache
          src: >-
            bootstrap.py
            scripts
            tests
            .codex/hooks

      - name: Verify Ruff formatting
        run: ruff format --check --no-cache bootstrap.py scripts tests .codex/hooks

      - name: Run repository governance monitors
        run: >-
          python -m unittest
          tests.test_repository_hygiene
          tests.test_markdown_integrity
          tests.test_package_release.PackageReleaseTests.test_ci_workflow_is_read_only_hosted_and_immutably_pinned
          tests.test_package_release.PackageReleaseTests.test_ci_push_branches_and_precheck_order_are_exact
          -v

      - name: Run Engine characterization contracts
        run: >-
          python -m unittest
          tests.test_engine_characterization
          tests.test_engine_parity
          -v

      - name: Render sanitized published and Golden Project diagrams
        run: |
          python -m tests.render_mermaid_fixtures --output-dir "${RUNNER_TEMP}/fastlane-mermaid"
          for source in "${RUNNER_TEMP}"/fastlane-mermaid/*.mmd; do
            for theme in default dark; do
              background="white"
              if [ "${theme}" = "dark" ]; then
                background="#333333"
              fi
              npx --yes @mermaid-js/mermaid-cli@11.16.0 \
                --theme "${theme}" \
                --backgroundColor "${background}" \
                -i "${source}" \
                -o "${source%.mmd}.${theme}.svg"
            done
          done
          test "$(find "${RUNNER_TEMP}/fastlane-mermaid" -name '*.svg' | wc -l)" -eq 22

      - name: Preserve sanitized rendered-diagram review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fastlane-mermaid-rendered-${{ env.FASTLANE_CANDIDATE_COMMIT }}
          path: ${{ runner.temp }}/fastlane-mermaid/*.svg
          if-no-files-found: error
          retention-days: 14

      - name: Verify template manifest hashes
        run: python scripts/update_manifest.py --check

      - name: Enforce customer package version identity
        if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'fast-lane') || (github.event_name == 'push' && github.ref_name == 'fast-lane') }}
        run: python scripts/package_release.py --check --base-commit "${FASTLANE_BASE_COMMIT}"

      - name: Verify deterministic release package
        run: python scripts/package_release.py --check

  safety-tests:
    needs: repository-precheck
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Require successful repository precheck
        if: ${{ needs.repository-precheck.result != 'success' }}
        run: |
          echo "Repository precheck did not pass."
          exit 1

      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.FASTLANE_CANDIDATE_COMMIT }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "${FASTLANE_CANDIDATE_COMMIT}"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run maintainer safety tests
        run: python -m unittest discover -s tests -v

      - name: Exercise the read-only prerequisite CLI
        run: python scripts/setup_assistant.py prerequisites --root . --json || test $? -eq 1

      - name: Verify template manifest hashes
        run: python scripts/update_manifest.py --check

      - name: Verify deterministic release package
        run: python scripts/package_release.py --check

  windows-smoke:
    needs: repository-precheck
    if: ${{ always() }}
    runs-on: windows-latest

    steps:
      - name: Require successful repository precheck
        if: ${{ needs.repository-precheck.result != 'success' }}
        shell: pwsh
        run: |
          Write-Error "Repository precheck did not pass."
          exit 1

      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.FASTLANE_CANDIDATE_COMMIT }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        shell: pwsh
        run: if ((git rev-parse HEAD) -ne $env:FASTLANE_CANDIDATE_COMMIT) { exit 1 }

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Run Windows safety tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Verify deterministic Windows and WSL prerequisite rendering
        shell: pwsh
        run: >-
          python -m unittest
          tests.test_setup_assistant.SetupAssistantTests.test_windows_prefers_supported_python3_when_python_is_old
          tests.test_setup_assistant.SetupAssistantTests.test_wsl1_is_unsupported_and_wsl2_requires_bubblewrap
          tests.test_setup_assistant.SetupAssistantTests.test_platform_specific_checklists_are_exact_and_owner_run
          -v

      - name: Exercise the Windows read-only prerequisite CLI
        shell: pwsh
        run: |
          python .\scripts\setup_assistant.py prerequisites --root . --json
          $prerequisiteExitCode = $LASTEXITCODE
          if ($prerequisiteExitCode -notin 0, 1) { exit $prerequisiteExitCode }
          exit 0

      - name: Verify manifest and release package
        shell: pwsh
        run: |
          python .\scripts\update_manifest.py --check
          python .\scripts\package_release.py --check

  macos-setup-smoke:
    needs: repository-precheck
    if: ${{ always() }}
    runs-on: macos-latest

    steps:
      - name: Require successful repository precheck
        if: ${{ needs.repository-precheck.result != 'success' }}
        run: |
          echo "Repository precheck did not pass."
          exit 1

      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.FASTLANE_CANDIDATE_COMMIT }}
          persist-credentials: false

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "${FASTLANE_CANDIDATE_COMMIT}"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Run macOS safety tests
        run: python -m unittest discover -s tests -v

      - name: Run extracted release and Fastlane Engine smoke
        run: >-
          python -m unittest
          tests.test_package_release.PackageReleaseTests.test_extracted_release_configures_in_place_and_passes_doctor
          -v

      - name: Exercise the macOS read-only prerequisite CLI
        run: python scripts/setup_assistant.py prerequisites --root . --json || test $? -eq 1

      - name: Verify macOS manifest and release package
        run: |
          python scripts/update_manifest.py --check
          python scripts/package_release.py --check
